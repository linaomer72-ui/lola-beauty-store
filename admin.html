<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lola Beauty - لوحة الإدارة</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="admin-page"><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/lola-logo.jpg"><span><b>Lola Beauty</b><small>لوحة الإدارة</small></span></a><button id="logout" class="ghost hidden">تسجيل الخروج</button></div></header><main class="wrap admin-main"><section id="loginBox" class="panel"><h1>دخول الإدارة 🔐</h1><p>استخدمي البريد وكلمة المرور التي أنشأتها في Supabase.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login" class="btn">دخول</button><div id="loginMsg" class="msg"></div></section><section id="dashboard" class="hidden"><div class="admin-grid"><div class="panel"><h2>إعدادات المتجر</h2><input id="storeName" placeholder="اسم المتجر"><input id="whatsapp" placeholder="واتساب مثل 201096605331"><input id="tiktok" placeholder="TikTok"><input id="primaryColor" type="color"><input id="secondaryColor" type="color"><textarea id="paymentAr" placeholder="معلومات الدفع بالعربي"></textarea><textarea id="paymentEn" placeholder="Payment info in English"></textarea><textarea id="deliveryAr" placeholder="التوصيل بالعربي"></textarea><textarea id="deliveryEn" placeholder="Delivery in English"></textarea><button id="saveSettings" class="btn">حفظ الإعدادات</button><div id="settingsMsg" class="msg"></div></div><div class="panel"><h2>إضافة / تعديل منتج</h2><input id="productId" type="hidden"><input id="nameAr" placeholder="اسم المنتج بالعربي"><input id="nameEn" placeholder="Product name in English"><textarea id="descAr" placeholder="الوصف بالعربي"></textarea><textarea id="descEn" placeholder="Description in English"></textarea><input id="price" type="number" step="0.01" placeholder="السعر بالجنيه"><select id="category"><option value="skin">العناية بالبشرة</option><option value="hair">العناية بالشعر</option><option value="lips">الشفاه</option></select><input id="image" type="file" accept="image/*"><label class="check"><input id="active" type="checkbox" checked> المنتج ظاهر للزبائن</label><button id="saveProduct" class="btn">حفظ المنتج</button><button id="cancelEdit" class="ghost hidden">إلغاء التعديل</button><div id="productMsg" class="msg"></div></div></div><div class="panel"><div class="section-head"><h2>المنتجات</h2><button id="refresh" class="ghost">تحديث</button></div><div id="adminProducts" class="admin-list"></div></div></section></main><script src="admin.js"></script></body></html>
